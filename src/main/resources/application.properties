server.port=8081

# Default database: embedded H2, stored in ./data (created automatically, no setup needed)
spring.datasource.url=jdbc:h2:file:./data/food_ordering;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Handy for inspecting data: http://localhost:8081/h2-console
spring.h2.console.enabled=true
